# Pipeline stages (mutually exclusive — one per issue)
- name: "pipeline:review"
  color: "d876e3"
  description: "PRDs submitted for review — review team analysing"
- name: "pipeline:decompose"
  color: "c9b4e8"
  description: "Reviewed PRDs ready for decomposition into epics"
- name: "pipeline:design"
  color: "f9d0c4"
  description: "Epic needs architecture and/or UX design"
- name: "pipeline:implement"
  color: "1d76db"
  description: "Task ready for or in implementation (includes specialist PR review)"
- name: "pipeline:deliver"
  color: "2ea44f"
  description: "Verified — ready for E2E, docs, release"
- name: "pipeline:done"
  color: "0e8a16"
  description: "Completed and delivered"

# Work types
- name: "type:prd-review"
  color: "d876e3"
  description: "PRD review cycle issue"
- name: "type:epic"
  color: "3E4B9E"
  description: "Epic — significant slice of work, may span repos"
- name: "type:task"
  color: "008672"
  description: "Implementation task within an epic"
- name: "type:bug"
  color: "d73a4a"
  description: "Bug report"
- name: "type:tech-debt"
  color: "e4e669"
  description: "Technical debt item"
- name: "type:spike"
  color: "c2e0c6"
  description: "Research or investigation task"
- name: "type:amendment"
  color: "ff7b72"
  description: "Upstream doc gap found during downstream work — backward transition"

# Initiative labels (grouping key for related epics)
# These are created dynamically during decomposition:
#   initiative:[name]

# Domain areas
- name: "domain:backend"
  color: "c2e0c6"
  description: "Affects backend/API repositories"
- name: "domain:frontend"
  color: "bfd4f2"
  description: "Affects frontend/UI repositories"
- name: "domain:database"
  color: "d4c5f9"
  description: "Affects database schema or data"
- name: "domain:shared"
  color: "fef2c0"
  description: "Affects shared libraries"
- name: "domain:infra"
  color: "f9d0c4"
  description: "Affects infrastructure"
- name: "domain:docs"
  color: "fef2c0"
  description: "Documentation only"
- name: "domain:cross-repo"
  color: "e36209"
  description: "Spans multiple repositories"

# Priority
- name: "priority:critical"
  color: "b60205"
  description: "Must be resolved immediately"
- name: "priority:high"
  color: "d93f0b"
  description: "Should be resolved this sprint"
- name: "priority:medium"
  color: "fbca04"
  description: "Should be resolved soon"
- name: "priority:low"
  color: "0e8a16"
  description: "Nice to have"

# Work state
- name: "blocked"
  color: "b60205"
  description: "Blocked — waiting for another issue"
- name: "needs-stakeholder-input"
  color: "ff9f1c"
  description: "Waiting for human/user input before proceeding"
